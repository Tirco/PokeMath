<html>
  <body>
    <button id="secretButton">Click me!</button>
    <p id="teaseMessage"></p>
    <script>
      const button = document.getElementById('secretButton');
      const teaseMessage = document.getElementById('teaseMessage');

      button.addEventListener('click', () => {
        const messages = [
          "Almost there...",
          "I feel something happening!",
          "Keep clicking, you're getting close!",
          "Something is definitely happening!"
        ];
        teaseMessage.innerText = messages[Math.floor(Math.random() * messages.length)];
      });
    </script>
  </body>
</html>
