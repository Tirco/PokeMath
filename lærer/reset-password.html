<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tilbakestill passord – PokeMath Lærer</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/lærer/teacher.css?v=1">
</head>
<body>
  <main class="teacher-page">
    <header class="teacher-header">
      <div class="brand">
        <div class="logo"><img src="/images/logo.png" alt="PokeMath"></div>
        <div class="brand-name">
          <div class="title">PokeMath – Lærer</div>
          <div class="subtitle">Tilbakestill passord</div>
        </div>
      </div>
      <a class="link" href="/lærer/index.html">← Til innlogging</a>
    </header>

    <section class="panel" id="resetBox">
      <h2>Velg nytt passord</h2>
      <p class="muted">Passordet må være minst 8 tegn.</p>
      <div class="form-grid" style="margin-top:14px;">
        <label class="field">
          <span>Nytt passord</span>
          <input id="pw1" type="password" autocomplete="new-password" placeholder="Minst 8 tegn">
        </label>
        <label class="field">
          <span>Bekreft passord</span>
          <input id="pw2" type="password" autocomplete="new-password" placeholder="Gjenta passordet">
        </label>
      </div>
      <div class="actions">
        <button class="btn primary" id="submitBtn">Lagre nytt passord</button>
      </div>
      <div class="status" id="resetStatus"></div>
    </section>

    <section class="panel" id="invalidBox" style="display:none;">
      <h2>Ugyldig eller utløpt link</h2>
      <p class="muted">Denne reset-linken er ikke lenger gyldig (utløper etter 1 time).</p>
      <div class="actions">
        <a class="btn primary" href="/lærer/index.html">Gå til innlogging</a>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const token = (params.get("token") || "").trim();

    if (!token) {
      document.getElementById("resetBox").style.display = "none";
      document.getElementById("invalidBox").style.display = "block";
    }

    function setStatus(msg, kind) {
      const el = document.getElementById("resetStatus");
      el.className = "status " + (kind === "good" ? "good" : kind === "bad" ? "bad" : "");
      el.textContent = msg || "";
    }

    document.getElementById("submitBtn").addEventListener("click", async () => {
      const pw1 = document.getElementById("pw1").value;
      const pw2 = document.getElementById("pw2").value;

      if (pw1.length < 8) return setStatus("Passordet må være minst 8 tegn.", "bad");
      if (pw1 !== pw2)    return setStatus("Passordene er ikke like.", "bad");

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Lagrer…";
      setStatus("", "");

      try {
        const r = await fetch("/teacher/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password: pw1 })
        });
        const d = await r.json();

        if (!d.ok) {
          if (r.status === 400 && d.message && d.message.includes("ugyldig")) {
            document.getElementById("resetBox").style.display = "none";
            document.getElementById("invalidBox").style.display = "block";
            return;
          }
          setStatus(d.message || "Noe gikk galt.", "bad");
          btn.disabled = false;
          btn.textContent = "Lagre nytt passord";
          return;
        }

        setStatus(d.message, "good");
        btn.style.display = "none";
        setTimeout(() => { location.href = "/lærer/index.html"; }, 2500);

      } catch (e) {
        setStatus("Nettverksfeil. Prøv igjen.", "bad");
        btn.disabled = false;
        btn.textContent = "Lagre nytt passord";
      }
    });

    // Allow Enter key in password fields
    ["pw1","pw2"].forEach(id => {
      document.getElementById(id).addEventListener("keydown", e => {
        if (e.key === "Enter") document.getElementById("submitBtn").click();
      });
    });
  </script>
</body>
</html>
