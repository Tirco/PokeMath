		// ── Carousel (backgrounds) ────────────────────────────────────────────
		function carouselStep(btn, dir) {
			const wrap = btn.closest('.carousel-wrap');
			const track = wrap.querySelector('.carousel-track');
			const count = track.children.length;
			const idx = ((parseInt(track.dataset.idx || 0) + dir) + count) % count;
			track.dataset.idx = idx;
			track.style.transform = 'translateX(-' + (idx * 100) + '%)';
		}

		function buildCarousel(trackEl, items) {
			trackEl.innerHTML = items.map(function(item) {
				return '<div class="carousel-cell" style="background-image:url(\'images/backgrounds/' + item.id + '.png\')">'
					+ '<div class="carousel-caption" id="' + item.id + '">'
					+ '<h3>' + item.name + '</h3>'
					+ '<a class="pricetag" data-price="' + item.price + '"></a>'
					+ '<br><br>'
					+ '<button class="button-1 buy" onclick="shopButtonBuy(this)">Kjøp</button>'
					+ '<button class="button-1 disabled use" onclick="shopButtonUse(this)">Bruk</button>'
					+ '<br>'
					+ '<span class="hovertext" data-hover="Denne bakgrunnen kan du bruke på hele nettsiden!">?</span>'
					+ '</div></div>';
			}).join('');
		}

		// ── Icon grid ─────────────────────────────────────────────────────────
		function seededShuffle(arr, seed) {
			const a = [...arr];
			let s = seed >>> 0;
			for (let i = a.length - 1; i > 0; i--) {
				s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
				const j = s % (i + 1);
				[a[i], a[j]] = [a[j], a[i]];
			}
			return a;
		}

		function fmtPrice(n) {
			return n.toLocaleString('no-NO');
		}

		function buildIconCard(item) {
			const isFree = item.price === 0;
			const priceHtml = isFree
				? ''
				: '<a class="pricetag" data-price="' + item.price + '">' + item.price.toLocaleString('no-NO') + '</a>';
			const buyBtn = isFree
				? ''
				: '<button class="button-1 buy" onclick="playerIconButtonBuy(this)">Kjøp</button>';
			return '<div class="icon-card" id="' + item.id + '">'
				+ '<img src="' + item.img + '" class="icon-card-img" alt="' + item.name + '" loading="lazy">'
				+ '<div class="icon-card-name">' + item.name + '</div>'
				+ priceHtml
				+ '<div class="icon-card-actions">'
				+ buyBtn
				+ '<button class="button-1 use disabled" onclick="playerIconButtonUse(this)">Bruk</button>'
				+ '</div>'
				+ '</div>';
		}

		function buildIconSections() {
			const free      = ICON_ITEMS.filter(i => i.price === 0);
			const always    = ICON_ITEMS.filter(i => i.price === 5000);
			const rotatable = ICON_ITEMS.filter(i => i.price > 5000);
			const exclusive = ICON_ITEMS.filter(i => i.price === -1);

			// Week seed: floor(unix_ms / ms_per_week), shifted to Monday start
			const MS_PER_WEEK = 7 * 24 * 60 * 60 * 1000;
			// JS epoch (Jan 1 1970) was a Thursday; shift by 3 days to align to Monday
			const weekSeed = Math.floor((Date.now() - 3 * 24 * 60 * 60 * 1000) / MS_PER_WEEK);
			const weekly = seededShuffle(rotatable, weekSeed).slice(0, 10);

			document.getElementById('freeIconGrid').innerHTML   = free.map(buildIconCard).join('');
			document.getElementById('alwaysIconGrid').innerHTML = always.map(buildIconCard).join('');
			document.getElementById('weeklyIconGrid').innerHTML = weekly.map(buildIconCard).join('');

			// Exclusive section is rendered later by loadShopLocal() once shopOptions is available
		}

		buildCarousel(document.querySelector('#bgWrap .carousel-track'), BG_ITEMS);
		buildIconSections();
